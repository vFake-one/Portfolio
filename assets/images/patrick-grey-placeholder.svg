<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 540" role="img" aria-label="Patrick Grey — Professional Portrait Placeholder">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d1527"/>
      <stop offset="60%" stop-color="#131e36"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
    <linearGradient id="emeraldAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <pattern id="gridPattern" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="0.7" stroke-opacity="0.6"/>
    </pattern>
  </defs>

  <!-- Card Background -->
  <rect width="480" height="540" rx="20" fill="url(#bgGrad)"/>
  <rect width="480" height="540" rx="20" fill="url(#gridPattern)"/>
  <rect x="1.5" y="1.5" width="477" height="537" rx="18.5" fill="none" stroke="#1e293b" stroke-width="2"/>

  <!-- Subtle Background Price Structure Curve -->
  <polyline fill="none" stroke="#10b981" stroke-width="2" stroke-opacity="0.22"
    points="24,410 92,360 135,385 210,305 265,335 348,250 402,272 456,210"/>

  <!-- Professional Silhouette Avatar Frame -->
  <circle cx="240" cy="215" r="108" fill="#0b1324" stroke="#10b981" stroke-width="2" stroke-opacity="0.45"/>
  <circle cx="240" cy="215" r="96" fill="#111c33"/>

  <!-- Head & Shoulders Professional Silhouette -->
  <circle cx="240" cy="182" r="36" fill="#334155"/>
  <path d="M174 282 C174 238, 306 238, 306 282 Z" fill="#334155"/>

  <!-- Monogram Badge -->
  <circle cx="316" cy="278" r="26" fill="url(#emeraldAccent)" stroke="#0b1324" stroke-width="4"/>
  <text x="316" y="284" text-anchor="middle" fill="#ffffff" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700">PG</text>

  <!-- Trader Identity Footer Panel -->
  <rect x="36" y="365" width="408" height="136" rx="14" fill="#0b1324" fill-opacity="0.9" stroke="#1e293b" stroke-width="1.5"/>
  <rect x="36" y="365" width="6" height="136" rx="3" fill="url(#emeraldAccent)"/>

  <text x="64" y="404" fill="#f8fafc" font-family="Inter, system-ui, sans-serif" font-size="22" font-weight="700">Patrick Grey</text>
  <text x="64" y="430" fill="#10b981" font-family="Inter, system-ui, sans-serif" font-size="13.5" font-weight="600">Intermediate Forex Trader | 3 Years Experience</text>
  <text x="64" y="456" fill="#94a3b8" font-family="Inter, system-ui, sans-serif" font-size="12.5">Methodology: Advanced Price Action &amp; Market Structure</text>
  <text x="64" y="480" fill="#64748b" font-family="Inter, system-ui, sans-serif" font-size="11">Portrait placeholder — replaceable via Admin Dashboard</text>
</svg>
