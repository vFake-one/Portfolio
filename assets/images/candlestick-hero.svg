<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 440" role="img" aria-label="Advanced Price Action and Market Structure Chart Illustration">
  <defs>
    <linearGradient id="panelBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d162a"/>
      <stop offset="100%" stop-color="#09101f"/>
    </linearGradient>
    <linearGradient id="areaFill" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#10b981" stop-opacity="0.0"/>
    </linearGradient>
  </defs>

  <rect width="640" height="440" rx="18" fill="url(#panelBg)" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Top Terminal Header Bar -->
  <rect x="1" y="1" width="638" height="44" rx="17" fill="#111b30"/>
  <circle cx="26" cy="23" r="5" fill="#ef4444" fill-opacity="0.8"/>
  <circle cx="44" cy="23" r="5" fill="#f59e0b" fill-opacity="0.8"/>
  <circle cx="62" cy="23" r="5" fill="#10b981" fill-opacity="0.8"/>
  <text x="88" y="27" fill="#cbd5e1" font-family="monospace" font-size="12" font-weight="600">PRICE ACTION STRUCTURE • H4 / D1 TECHNICAL FRAMEWORK</text>
  <rect x="506" y="12" width="114" height="22" rx="11" fill="rgba(16,185,129,0.14)" stroke="rgba(16,185,129,0.4)"/>
  <text x="563" y="27" text-anchor="middle" fill="#34d399" font-family="sans-serif" font-size="10.5" font-weight="700">RISK-DEFINED</text>

  <!-- Horizontal Grid Lines -->
  <g stroke="#1e293b" stroke-width="1" stroke-dasharray="4 4">
    <line x1="32" y1="95" x2="608" y2="95"/>
    <line x1="32" y1="160" x2="608" y2="160"/>
    <line x1="32" y1="225" x2="608" y2="225"/>
    <line x1="32" y1="290" x2="608" y2="290"/>
    <line x1="32" y1="355" x2="608" y2="355"/>
  </g>

  <!-- Key Structural Support / Resistance Zone (Break & Retest Level) -->
  <rect x="32" y="216" width="576" height="22" rx="3" fill="rgba(16,185,129,0.11)" stroke="rgba(16,185,129,0.35)" stroke-width="1"/>
  <text x="44" y="230" fill="#34d399" font-family="monospace" font-size="10.5">KEY STRUCTURAL SR ZONE (PREVIOUS RESISTANCE → SUPPORT RETEST)</text>

  <!-- Planned Risk / Reward Box on Right Side -->
  <rect x="404" y="88" width="166" height="128" rx="4" fill="rgba(16,185,129,0.10)" stroke="#10b981" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="414" y="106" fill="#6ee7b7" font-family="sans-serif" font-size="10.5" font-weight="700">PLANNED TARGET ZONE (TP)</text>
  <text x="414" y="121" fill="#94a3b8" font-family="monospace" font-size="10">Opposing HTF Structure</text>

  <rect x="404" y="216" width="166" height="58" rx="4" fill="rgba(239,68,68,0.12)" stroke="#ef4444" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="414" y="264" fill="#fca5a5" font-family="sans-serif" font-size="10.5" font-weight="700">STOP-LOSS (INVALIDATION)</text>

  <!-- Candlesticks Sequence -->
  <!-- 1: Bullish impulse -->
  <line x1="66" y1="320" x2="66" y2="375" stroke="#10b981" stroke-width="2"/>
  <rect x="59" y="330" width="14" height="36" rx="2" fill="#10b981"/>

  <line x1="98" y1="280" x2="98" y2="340" stroke="#10b981" stroke-width="2"/>
  <rect x="91" y="290" width="14" height="40" rx="2" fill="#10b981"/>

  <!-- 2: First test of resistance & pullback -->
  <line x1="130" y1="220" x2="130" y2="296" stroke="#10b981" stroke-width="2"/>
  <rect x="123" y="234" width="14" height="56" rx="2" fill="#10b981"/>

  <line x1="162" y1="228" x2="162" y2="282" stroke="#ef4444" stroke-width="2"/>
  <rect x="155" y="236" width="14" height="34" rx="2" fill="#ef4444"/>

  <line x1="194" y1="262" x2="194" y2="314" stroke="#ef4444" stroke-width="2"/>
  <rect x="187" y="270" width="14" height="32" rx="2" fill="#ef4444"/>

  <!-- 3: Higher Low (HL) & Breakout above zone -->
  <line x1="226" y1="246" x2="226" y2="306" stroke="#10b981" stroke-width="2"/>
  <rect x="219" y="254" width="14" height="46" rx="2" fill="#10b981"/>

  <line x1="258" y1="192" x2="258" y2="260" stroke="#10b981" stroke-width="2"/>
  <rect x="251" y="200" width="14" height="54" rx="2" fill="#10b981"/>

  <line x1="290" y1="154" x2="290" y2="210" stroke="#10b981" stroke-width="2"/>
  <rect x="283" y="164" width="14" height="38" rx="2" fill="#10b981"/>

  <!-- 4: Controlled Pullback to Retest Structure -->
  <line x1="322" y1="160" x2="322" y2="206" stroke="#ef4444" stroke-width="2"/>
  <rect x="315" y="166" width="14" height="32" rx="2" fill="#ef4444"/>

  <line x1="354" y1="190" x2="354" y2="236" stroke="#ef4444" stroke-width="2"/>
  <rect x="347" y="198" width="14" height="28" rx="2" fill="#ef4444"/>

  <!-- 5: Rejection Pin Bar + Bullish Engulfing Confirmation at Zone -->
  <line x1="386" y1="198" x2="386" y2="252" stroke="#10b981" stroke-width="2"/>
  <rect x="379" y="206" width="14" height="16" rx="2" fill="#10b981"/>

  <line x1="418" y1="168" x2="418" y2="226" stroke="#10b981" stroke-width="2"/>
  <rect x="411" y="176" width="14" height="44" rx="2" fill="#10b981"/>

  <!-- 6: Follow-through toward target -->
  <line x1="450" y1="138" x2="450" y2="184" stroke="#10b981" stroke-width="2"/>
  <rect x="443" y="144" width="14" height="32" rx="2" fill="#10b981"/>

  <line x1="482" y1="112" x2="482" y2="156" stroke="#10b981" stroke-width="2"/>
  <rect x="475" y="118" width="14" height="28" rx="2" fill="#10b981"/>

  <!-- Annotations -->
  <circle cx="194" cy="316" r="4" fill="#38bdf8"/>
  <text x="172" y="334" fill="#38bdf8" font-family="sans-serif" font-size="10" font-weight="600">Higher Low (HL)</text>

  <circle cx="290" cy="150" r="4" fill="#10b981"/>
  <text x="248" y="140" fill="#10b981" font-family="sans-serif" font-size="10" font-weight="700">Break of Structure (BOS)</text>

  <circle cx="386" cy="252" r="4" fill="#fbbf24"/>
  <text x="315" y="272" fill="#fbbf24" font-family="sans-serif" font-size="10" font-weight="600">Rejection Wick Retest</text>

  <!-- Bottom Caption Bar -->
  <rect x="32" y="384" width="576" height="36" rx="8" fill="#111b30" stroke="#1e293b"/>
  <text x="48" y="406" fill="#94a3b8" font-family="sans-serif" font-size="11">
    Illustrative technical diagram showing Market Structure, Support/Resistance Retest, and Predefined Stop-Loss Placement.
  </text>
</svg>
